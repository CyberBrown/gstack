name: Fork CI
# CyberBrown/gstack fork CI (TOOL-01). Upstream's eval workflows target `main`
# and ubicloud runners, so they never covered the fork's default branch.
on:
  pull_request:
  push:
    branches: [chris/remove-unused-hosts]

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fork-delta:
    name: fork-delta tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Stub `claude` on PATH
        # test/host-config.test.ts "detect finds claude" expects the Claude
        # CLI on PATH (true on a dev box). A no-op stub keeps host detection
        # honest on a bare runner without installing the real CLI.
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/bin/claude"
          chmod +x "$RUNNER_TEMP/bin/claude"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Fork-delta test suite
        run: >-
          bun test
          test/hermes-hardening.test.ts
          test/codex-hardening.test.ts
          test/outside-prompt.test.ts
          test/host-config.test.ts
          test/gen-skill-docs.test.ts
          test/skill-collision-sentinel.test.ts
      - name: Generated skill docs are fresh
        run: |
          bun run gen:skill-docs
          git diff --exit-code -- '*.md' || {
            echo "Generated SKILL.md files are stale. Run: bun run gen:skill-docs"
            exit 1
          }

  free-suite:
    # Upstream v1.35's full free suite has known failures on the fork's
    # default branch (doc inventory misses /document-generate; browse,
    # gbrain-sync and team-init tests need a local environment). Reported,
    # not gating, until the upstream consolidation (OPS-01) lands.
    name: free suite (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Free suite (failures reported as a warning, not hidden)
        shell: bash
        run: |
          set +e
          bun run test 2>&1 | tee free-suite.log
          rc=${PIPESTATUS[0]}
          fails=$(grep -c '^(fail)' free-suite.log)
          {
            echo "### Free suite (informational)"
            echo "exit code: $rc, failing tests: $fails"
            echo '```'
            grep '^(fail)' free-suite.log | sed 's/ \[.*//' | sort -u | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=free suite (informational)::$fails failing tests (exit $rc). Known upstream v1.35 and environment failures; not gating until the upstream consolidation (OPS-01). See the job summary."
          fi
          exit 0
